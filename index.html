<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Log Classifier</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; }
  textarea { width: 100%; height: 220px; font-family: Consolas, monospace; font-size: 13px; padding: 10px; box-sizing: border-box; }
  button { padding: 9px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button.ex { background: #e5e7eb; color: #111; margin-right: 6px; font-size: 13px; padding: 6px 12px; }
  #result { margin-top: 20px; display: none; }
  .cause { font-size: 22px; font-weight: 700; }
  .bar { background: #e5e7eb; border-radius: 6px; height: 16px; margin: 8px 0; overflow: hidden; }
  .fill { background: #2563eb; height: 100%; width: 0; }
  pre { background: #f6f7f9; padding: 10px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; font-size: 13px; }
  mark { background: #fde68a; }
  .chip { display: inline-block; background: #fde68a; border-radius: 12px; padding: 2px 10px; margin: 2px; font-size: 13px; }
</style>
</head>
<body>
<h1>CI Log Classifier</h1>
<p class="sub">Paste the last lines of a failed build log and find out why it failed.</p>
<div>
  <span>Try an example: </span>
  <button class="ex" onclick="ex(0)">Test failure</button>
  <button class="ex" onclick="ex(1)">Missing package</button>
  <button class="ex" onclick="ex(2)">Lint error</button>
</div>
<p><textarea id="log" placeholder="Paste a failed build log here..."></textarea></p>
<button onclick="run()">Classify</button>
<div id="result">
  <div class="cause" id="cause"></div>
  <div>Confidence: <span id="conf"></span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p><b>Words that drove the answer:</b> <span id="chips"></span></p>
  <p><b>Your log, with those words highlighted:</b></p>
  <pre id="shown"></pre>
</div>
<script>
const EX = [
 "=== FAILURES ===\n___ test_parse_dates ___\n    def test_parse_dates():\n>       assert result == expected\nE       AssertionError: assert 3 == 4\ntests/test_dates.py:42: AssertionError\n=== short test summary info ===\nFAILED tests/test_dates.py::test_parse_dates - AssertionError\n=== 1 failed, 214 passed in 12.40s ===\nProcess completed with exit code 1.",
 "Collecting scipy-openblas32==0.3.34\nERROR: Could not find a version that satisfies the requirement scipy-openblas32==0.3.34 (from versions: 0.3.23, 0.3.24)\nERROR: No matching distribution found for scipy-openblas32==0.3.34\nProcess completed with exit code 1.",
 "Run ruff check .\nsrc/utils.py:10:1: F401 `os` imported but unused\nsrc/utils.py:25:80: E501 Line too long\nFound 2 errors.\nruff failed\nProcess completed with exit code 1."
];
EX[2] = "[command]/usr/bin/git config --local --name-only --get-regexp ^includeIf\\.gitdir:\nincludeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git.path\nincludeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git/worktrees/*.path\nincludeif.gitdir:/github/workspace/.git.path\nincludeif.gitdir:/github/workspace/.git/worktrees/*.path\n[command]/usr/bin/git config --local --get-all includeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git.path\n/home/runner/work/_temp/git-credentials-e88bb7fe-5942-46f1-8509-84ba2869484f.config\n[command]/usr/bin/git config --local --unset includeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git.path \\/home\\/runner\\/work\\/_temp\\/git\\-credentials\\-e88bb7fe\\-5942\\-46f1\\-8509\\-84ba2869484f\\.config\n[command]/usr/bin/git config --local --get-all includeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git/worktrees/*.path\n/home/runner/work/_temp/git-credentials-e88bb7fe-5942-46f1-8509-84ba2869484f.config\n[command]/usr/bin/git config --local --unset includeif.gitdir:/home/runner/work/scikit-learn/scikit-learn/.git/worktrees/*.path \\/home\\/runner\\/work\\/_temp\\/git\\-credentials\\-e88bb7fe\\-5942\\-46f1\\-8509\\-84ba2869484f\\.config\n[command]/usr/bin/git config --local --get-all includeif.gitdir:/github/workspace/.git.path\n/github/runner_temp/git-credentials-e88bb7fe-5942-46f1-8509-84ba2869484f.config\n[command]/usr/bin/git config --local --unset includeif.gitdir:/github/workspace/.git.path \\/github\\/runner_temp\\/git\\-credentials\\-e88bb7fe\\-5942\\-46f1\\-8509\\-84ba2869484f\\.config\n[command]/usr/bin/git config --local --get-all includeif.gitdir:/github/workspace/.git/worktrees/*.path\n/github/runner_temp/git-credentials-e88bb7fe-5942-46f1-8509-84ba2869484f.config\n[command]/usr/bin/git config --local --unset includeif.gitdir:/github/workspace/.git/worktrees/*.path \\/github\\/runner_temp\\/git\\-credentials\\-e88bb7fe\\-5942\\-46f1\\-8509\\-84ba2869484f\\.config\n[command]/usr/bin/git submodule foreach --recursive git config --local --show-origin --name-only --get-regexp remote.origin.url\nRemoving credentials config '/home/runner/work/_temp/git-credentials-e88bb7fe-5942-46f1-8509-84ba2869484f.config'\nCleaning up orphan processes";
function ex(i) { document.getElementById("log").value = EX[i]; run(); }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function run() {
  const log = document.getElementById("log").value;
  if (!log.trim()) return;
  const r = await fetch("/classify", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({log}) });
  const d = await r.json();
  document.getElementById("result").style.display = "block";
  document.getElementById("cause").textContent = d.cause.replace("_", " ");
  document.getElementById("conf").textContent = Math.round(d.confidence * 100) + "%";
  document.getElementById("fill").style.width = Math.round(d.confidence * 100) + "%";
  document.getElementById("chips").innerHTML = d.words.map(w => '<span class="chip">' + esc(w) + '</span>').join("") || "none";
  let html = esc(log.split("\n").slice(-200).join("\n"));
  const toks = [...new Set(d.words.join(" ").split(/\s+/).filter(t => t.length >= 3))];
  toks.forEach(t => {
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    html = html.replace(re, "<mark>$1</mark>");
  });
  document.getElementById("shown").innerHTML = html;
}
</script>
</body>
</html>
